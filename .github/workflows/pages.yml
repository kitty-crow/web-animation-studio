name: Check and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - run: bun install
        working-directory: vendor/code-guards
      - run: bun install
        working-directory: vendor/pages
      - name: Validate Pages configuration and version
        timeout-minutes: 2
        run: |
          bun vendor/pages/src/cli.ts version check
          bun vendor/pages/src/cli.ts check pages.config.ts
      - name: TypeScript compilation check
        timeout-minutes: 2
        run: bunx --no-install tsc --noEmit
      - name: GIF regression tests
        timeout-minutes: 2
        run: bun run test
      - name: All Code Guards (strict)
        timeout-minutes: 10
        run: bun run guard
      - name: Build validated site and studio bundles
        timeout-minutes: 3
        run: bun scripts/site.ts
      - uses: actions/cache@v4
        with:
          path: .asset-cache
          key: rvm-onnx-v1.0.0-release-assets-v1
      - name: Provision pinned ONNX model assets
        timeout-minutes: 6
        run: bun scripts/assets.ts
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
